# Only the privacy policy needs to be public — App Store Connect links to it.
#
# Everything else in docs/ is internal: strategy, investor material, and candid
# assessments. Until this exclude list existed, pitch-deck.html and
# market-analysis.html were both being served publicly at
# maxx-prophet.github.io/NowGo/ and were readable by anyone with the URL.
#
# Add any new internal doc here. The safer habit is to leave internal docs
# untracked (as nowgo-funding-request.md is) rather than rely on this list.
exclude:
  - superpowers/
  - pitch-deck.md
  - market-analysis.md
  - architecture-review.md
  - 2026-08-03-late-night-inventory-spec.md
  - 2026-06-14-constraint-bar-design.md
  - nowgo-funding-request.md
  - nowgo-com-outreach-email.md

defaults:
  - scope:
      path: ""
    values:
      render_with_liquid: false
